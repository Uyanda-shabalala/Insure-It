groq.api.key=${GROQ_API_KEY:${MY_SECRET_KEY:}}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
ocr.fallback.enabled=${OCR_FALLBACK_ENABLED:false}
ocr.fallback.url=${OCR_FALLBACK_URL:http://127.0.0.1:8001/ocr}
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=31MB
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
